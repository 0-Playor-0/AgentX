module: stack
oof_dir: public_oof            # $S6_DATA/public_oof/<source>/...
exclude_regex: "stack|blend|summit|anchor|submission|teacher_lb"   # stack-level / LB-tuned files
auc_max: 0.9625
lb_gap_max: 0.0008
ks_max: 0.02                   # max KS(OOF, test) of a member's prediction distributions
dedupe_corr: 0.999
lb: {}                         # regex on "source:member" -> that notebook's public LB (most members have none published)
inner_folds: 3
C_grid: [0.0001, 0.0003, 0.001, 0.003, 0.01, 0.1]
k_grid: [20, 40, 80]
k_all: true
rank_k_grid: [5, 10, 20]
extra: []                      # own members, e.g. [e2_lgb]; read from $S6_ART/oof|test/<name>.npy
exclude_es: false
# Members whose authors disclose early stopping on the fold they are scored on (mildly optimistic OOF).
# Regex on "<dataset dir>:<member>". Sources: golem manifest.csv `early_stopping`, megayak README,
# goodpjw2008 extra-members README; the same golem/megayak members re-appear in cdeotte's 124 set as gl_*/mg_*.
es_on_scored_fold:
  - '^s6e10-golem-oof-library:([ahijklmnpqrstu])$'
  - '^s6e10-golem-oof-library:wide\.([ahijklmnpqrstu])_'
  - ':gl_([ahijklmn])$'
  - '^s6e10-oof-library:predictions\.(lgb|xgb|cat|cat_ctr|lgb_route|lgb_ogteach)$'
  - ':mg_(lgb|xgb|cat|cat_ctr|lgb_route|lgb_ogteach)$'
  - '^s6e10-goodpjw2008-extra-members-oof:(xgb_k10|xgb_d10_k10|lgb_k10|cat_k10|cat_aux|cat_ctr_k|glm6_xgb_k|lgb_v3_k)$'
