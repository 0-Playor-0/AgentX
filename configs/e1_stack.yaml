module: stack
oof_dir: public_oof            # $S6_DATA/public_oof/<source>/...
exclude_regex: "stack|blend|summit|anchor|submission|teacher_lb|^nj_\\d+$"   # nj_* = najiama blends   # stack-level / LB-tuned files
auc_max: 0.9625
lb_gap_max: 0.0008
ks_max: 0.02                   # max KS(OOF, test) of a member's prediction distributions
dedupe_corr: 0.999
lb: {}                         # regex on "source:member" -> that notebook's public LB (most members have none published)
inner_folds: 3
C_grid: [0.0001, 0.0003, 0.001, 0.003, 0.01, 0.1]
k_grid: [20, 40, 80]
k_all: true
rank_k_grid: [5, 10, 20]
extra: []                      # own members, e.g. [e2_lgb]; read from $S6_ART/oof|test/<name>.npy
exclude_es: false
# Strict E1b: an author who disclosed early stopping on the scored fold for ANY member gets ALL members flagged,
# except members that author explicitly documents otherwise. Regex on "<dataset dir>:<member>"; cdeotte's
# 124-pair set re-hosts these authors as gl_* (golem), mg_* (megayak), gp_* (goodpjw2008).
es_authors:
  dariushafshar:        # golem manifest.csv `early_stopping`: b,c,d,f,g,o "none"; e = inner 10% split of training fold
    match: ['^s6e10-golem-oof-library:', ':gl_']
    exempt: ['^s6e10-golem-oof-library:[bcdefgo]$', '^s6e10-golem-oof-library:wide\.[bcdefgo]_', ':gl_[bcdefg]$']
  megayak:              # README: trees early-stopped on their validation fold; "RealMLPs train a fixed number of epochs"
    match: ['^s6e10-oof-library:', ':mg_']
    exempt: ['realmlp']
  goodpjw2008:          # extra-members README: tree members early-stop on the scored fold; nothing stated for the rest
    match: ['^s6e10-goodpjw2008-extra-members-oof:', ':gp_']
    exempt: []
